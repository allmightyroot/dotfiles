# Deployed as a symlink to ~/.tmux.conf by the sysprep-dotfiles role.

set -g mouse on
set -g history-limit 102400

# Windows and panes count from 1 (matches the keyboard row) and renumber when
# one closes. Short escape-time keeps vim snappy over SSH.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g aggressive-resize on

bind-key r source-file ~/.tmux.conf \; display-message 'reloaded ~/.tmux.conf'

# Mouse selections reach the local clipboard over SSH via OSC 52. iTerm2 also
# needs Settings > General > Selection > "Applications in terminal may access
# clipboard" turned on. Shift-drag (Option-drag in iTerm2) bypasses tmux and
# uses the terminal's native selection if that ever misbehaves.
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'

# Status line, Catppuccin Mocha palette. No plugin; the rounded pill caps need
# a Nerd Font in the terminal (Hack Nerd Font in iTerm2).
# base #1e1e2e  mantle #181825  surface0 #313244  text #cdd6f4  overlay0 #6c7086
# mauve #cba6f7  blue #89b4fa  green #a6e3a1  peach #fab387  red #f38ba8
set -as terminal-features ',xterm*:RGB'
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left-length 40
set -g status-right-length 160
# Session pill turns red while the prefix is held.
set -g status-left '#[fg=#{?client_prefix,#f38ba8,#cba6f7},bg=#181825]#[fg=#1e1e2e,bg=#{?client_prefix,#f38ba8,#cba6f7},bold] #S #[fg=#{?client_prefix,#f38ba8,#cba6f7},bg=#181825,nobold] '
# Right side: zoom marker, pane dir and git branch, load/mem/uptime, host and time.
# #(...) segments run every status-interval; keep them cheap.
set -g status-right '#{?window_zoomed_flag,#[fg=#fab387]zoom  ,}#[fg=#313244,bg=#181825]#[bg=#313244]#(~/.repos/mygit/dotfiles/scripts/tmux-status where "#{pane_current_path}") #[fg=#313244,bg=#181825] #[fg=#313244,bg=#181825]#[bg=#313244] #(~/.repos/mygit/dotfiles/scripts/tmux-status stats) #[fg=#313244,bg=#181825] #[fg=#313244,bg=#181825]#[bg=#313244]#[fg=#89b4fa] #h #[fg=#cdd6f4]%a %b %d  %-I:%M %p #[fg=#313244,bg=#181825]'
set -g window-status-separator ' '
set -g window-status-format '#[fg=#6c7086] #I:#W#{window_flags} '
set -g window-status-current-format '#[fg=#313244,bg=#181825]#[fg=#a6e3a1,bg=#313244,bold]#I:#W#{window_flags}#[fg=#313244,bg=#181825,nobold]'
set -g window-status-activity-style 'fg=#fab387'
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#cba6f7,fg=#1e1e2e'

bind-key P command-prompt -p 'save history to filename:' -I '~/tmux.history' 'capture-pane -S -32768 ; save-buffer %1 ; delete-buffer'
