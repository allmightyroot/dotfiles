# Deployed as a symlink to ~/.tmux.conf by the sysprep-dotfiles role.

set -g mouse on
set -g history-limit 102400

# Mouse selections reach the local clipboard over SSH via OSC 52. iTerm2 also
# needs Settings > General > Selection > "Applications in terminal may access
# clipboard" turned on. Shift-drag (Option-drag in iTerm2) bypasses tmux and
# uses the terminal's native selection if that ever misbehaves.
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'

bind-key P command-prompt -p 'save history to filename:' -I '~/tmux.history' 'capture-pane -S -32768 ; save-buffer %1 ; delete-buffer'
